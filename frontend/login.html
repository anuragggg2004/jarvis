<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS — Authentication Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #03060f;
            --panel-bg: rgba(6, 12, 28, 0.65);
            --accent-cyan: #00e5ff;
            --accent-blue: #0055ff;
            --accent-orange: #ff9100;
            --text-color: #e0f7fc;
            --text-muted: #628ea6;
            --border-color: rgba(0, 229, 255, 0.25);
            --glow-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 85, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(0, 229, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Scanline effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .login-container {
            width: 440px;
            padding: 40px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 229, 255, 0.05);
            position: relative;
            z-index: 10;
            animation: bootUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
        }

        @keyframes bootUp {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Glowing Tech Rings */
        .tech-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px dashed rgba(0, 229, 255, 0.3);
            position: absolute;
            top: -60px;
            left: calc(50% - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateRight 20s linear infinite;
        }

        .tech-ring-inner {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid rgba(0, 85, 255, 0.5);
            border-top: 3px solid var(--accent-cyan);
            animation: rotateLeft 10s linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tech-core {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-cyan) 0%, rgba(0, 85, 255, 0.8) 70%, transparent 100%);
            box-shadow: 0 0 20px var(--accent-cyan);
        }

        @keyframes rotateRight {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateLeft {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 35px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
            margin-bottom: 8px;
        }

        .header p {
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(4, 9, 20, 0.8);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.15), inset 0 0 10px rgba(0, 229, 255, 0.05);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, rgba(0, 229, 255, 0.8) 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 85, 255, 0.3);
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            box-shadow: var(--glow-shadow);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: -50%; left: -60%;
            width: 30%; height: 200%;
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(30deg);
            transition: all 0.5s ease;
            opacity: 0;
        }

        .btn-submit:hover::after {
            left: 130%;
            opacity: 1;
        }

        .error-message {
            margin-top: 20px;
            padding: 10px 14px;
            border-left: 3px solid var(--accent-orange);
            background: rgba(255, 145, 0, 0.08);
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--accent-orange);
            border-radius: 0 4px 4px 0;
            display: none;
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-note {
            text-align: center;
            margin-top: 30px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Hologram ring visual -->
        <div class="tech-ring">
            <div class="tech-ring-inner">
                <div class="tech-core"></div>
            </div>
        </div>

        <div class="header">
            <h1>JARVIS</h1>
            <p>Secure Interface Console v2.0</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Operator Identity</label>
                <div class="input-wrapper">
                    <input type="text" id="username" required value="anurag" autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Decryption Passphrase</label>
                <div class="input-wrapper">
                    <input type="password" id="password" required placeholder="••••••••••••" autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Initiate Decryption</button>

            <div class="error-message" id="errorMessage"></div>
        </form>

        <div class="footer-note">
            SECURE AIR-GAPPED LINK // LOCAL HOST ONLY
        </div>
    </div>

    <script src="auth.js?v=2.1"></script>

    <script>
        const API_BASE = window.API_BASE || 'http://localhost:8000';
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const btnSubmit = document.getElementById('btnSubmit');
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Deriving Keys...";

            try {
                // Prepare Form Data for OAuth2PasswordRequestForm
                const formData = new URLSearchParams();
                formData.append('username', usernameInput);
                formData.append('password', passwordInput);

                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Access denied, operator authentication failed.');
                }

                // Save token & master passphrase for local decryption if needed
                saveToken(data.access_token);
                // Also store password in sessionStorage so frontend can decrypt cached elements, or re-verify
                sessionStorage.setItem('jarvis_passphrase', passwordInput);

                btnSubmit.innerText = "System Access Granted";
                btnSubmit.style.background = 'linear-gradient(135deg, #00c853 0%, #64dd17 100%)';
                btnSubmit.style.boxShadow = '0 0 15px rgba(100, 221, 23, 0.4)';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                errorMessage.innerText = `[ERROR]: ${error.message}`;
                errorMessage.style.display = 'block';
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Initiate Decryption";
            }
        });

        // Check if already logged in
        (async () => {
            const token = getToken();
            if (token) {
                const isValid = await verifyAuth();
                if (isValid) {
                    window.location.href = 'index.html';
                }
            }
        })();
    </script>
</body>
</html>
